name: Update release info

on:
  schedule:
    # Runs once an hour. Adjust as you like — this call is cheap
    # (2 repos x 2 endpoints), nowhere near the 5,000/hr authenticated cap.
    - cron: '0 * * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch release + star data for both apps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          build_entry() {
            repo="$1"

            release_json=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/CtxtArc/${repo}/releases/latest" || echo "null")

            repo_json=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/CtxtArc/${repo}" || echo "null")

            stars=$(echo "$repo_json" | jq '.stargazers_count // null')

            if [ "$release_json" = "null" ]; then
              jq -n --argjson stars "$stars" \
                '{tag_name: null, name: null, published_at: null, apk_url: null, apk_size: null, stargazers_count: $stars}'
              return
            fi

            echo "$release_json" | jq --argjson stars "$stars" '
              {
                tag_name: .tag_name,
                name: .name,
                published_at: .published_at,
                apk_url: (.assets // [] | map(select(.name | test("\\.apk$"; "i"))) | .[0].browser_download_url // null),
                apk_size: (.assets // [] | map(select(.name | test("\\.apk$"; "i"))) | .[0].size // null),
                stargazers_count: $stars
              }'
          }

          asgard=$(build_entry "Asgard")
          yggdrasil=$(build_entry "YggdrasilMusicPlayer")

          jq -n --argjson asgard "$asgard" --argjson yggdrasil "$yggdrasil" \
            '{Asgard: $asgard, YggdrasilMusicPlayer: $yggdrasil, generated_at: now | todate}' \
            > release-info.json

          cat release-info.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release-info.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update release-info.json [skip ci]"
          git push
