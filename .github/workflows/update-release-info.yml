
name: Update release info

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-info-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch release + star data for all apps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          build_entry() {
            repo="$1"

            release_json=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/CtxtArc/${repo}/releases/latest" || echo "null")

            repo_json=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/CtxtArc/${repo}" || echo "null")

            stars=$(echo "$repo_json" | jq '.stargazers_count // null')

            if [ "$release_json" = "null" ]; then
              jq -n --argjson stars "$stars" \
                '{tag_name: null, name: null, published_at: null, apk_url: null, apk_size: null, stargazers_count: $stars}'
              return
            fi

            echo "$release_json" | jq --argjson stars "$stars" '
              {
                tag_name: .tag_name,
                name: .name,
                published_at: .published_at,
                apk_url: (.assets // [] | map(select(.name | test("\\.apk$"; "i"))) | .[0].browser_download_url // null),
                apk_size: (.assets // [] | map(select(.name | test("\\.apk$"; "i"))) | .[0].size // null),
                stargazers_count: $stars
              }'
          }

          asgard=$(build_entry "Asgard")
          yggdrasil=$(build_entry "YggdrasilMusicPlayer")
          better_edt=$(build_entry "better_EDT")

          jq -n \
            --argjson asgard "$asgard" \
            --argjson yggdrasil "$yggdrasil" \
            --argjson better_edt "$better_edt" \
            '{Asgard: $asgard, YggdrasilMusicPlayer: $yggdrasil, better_EDT: $better_edt, generated_at: now | todate}' \
            > release-info.json

          cat release-info.json

      - name: Commit if changed
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add release-info.json

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: update release-info.json [skip ci]"

          git fetch origin main

          if ! git rebase origin/main; then
            echo "Resolving release-info.json conflict using generated version"

            git checkout --theirs -- release-info.json
            git add release-info.json
            GIT_EDITOR=true git rebase --continue
          fi

          git push origin main
